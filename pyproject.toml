[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spanish-cita-monitor"
version = "0.1.0"
description = "Inspect the Spanish immigration appointment portal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.50,<2",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "python-telegram-bot>=22,<23",
]

[project.scripts]
cita-monitor = "cita_monitor.main:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cita_monitor"]

[tool.ruff]
line-length = 100
target-version = "py312"
